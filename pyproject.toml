[project]
name = "ouroboros"
version = "6.4.2"
description = "Self-creating agent"
authors = [{name = "Ouroboros", email = "agent@ouroboros.ai"}]
dependencies = []
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ouroboros"]