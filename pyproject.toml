[project]
name = "ouroboros"
version = "6.4.3"
description = "Self-creating agent"
authors = [{name = "Ouroboros", email = "agent@ouroboros.ai"}]
dependencies = [
    "openai>=1.0.0",
    "requests",
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.0.0",
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ouroboros"]